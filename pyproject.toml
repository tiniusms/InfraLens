[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infralens"
version = "0.1.0"
description = "Explainable power-cost forecasting and capital-risk screening for data-center locations."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "InfraLens" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.1",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
