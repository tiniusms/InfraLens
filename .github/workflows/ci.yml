name: CI

# Version 2 Phase 1A regression checks (TASKS.md, Phase 1 criteria 1-3).
# Runs the existing Python regression suite and the frontend checks on a
# GitHub-hosted runner. It never runs tests/test_final_holdout.py or
# python -m infralens.evaluation.final_holdout, never downloads or refreshes
# EIA or PJM data, reads no secret, and deploys nothing.
#
# The four gitignored data caches listed in README.md are absent on the runner,
# so the cache-dependent tests skip with their existing missing-file reasons
# (RISK_REGISTER.md, R7). CI pass counts are therefore lower than a local
# full-data run and are not compared with it.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python regression tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # requirements-lock.txt pins every package, including pip and the build
      # backend, with hashes (DECISIONS.md, 2026-11-23). The project itself is
      # installed without resolving anything further.
      - name: Install the locked environment
        run: |
          python -m pip install --require-hashes --no-deps --only-binary :all: -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Run regression tests (final holdout excluded)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests --ignore=tests/test_final_holdout.py -rs 2>&1 | tee pytest-output.txt

      - name: Record test counts and skip reasons
        if: always()
        shell: bash
        run: |
          if [ -f pytest-output.txt ]; then
            {
              echo "### Python regression tests (final holdout excluded)"
              echo ""
              echo "Data caches are absent on this runner. Cache-dependent tests skip with their recorded reasons."
              echo ""
              echo '```'
              grep -E '^(SKIPPED|FAILED|ERROR)' pytest-output.txt || true
              tail -n 1 pytest-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend-checks:
    name: Frontend test, lint, and build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build
