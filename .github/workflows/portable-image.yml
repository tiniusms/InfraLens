name: Portable image

# Build the portable image and exercise it on a GitHub-hosted Linux runner.
# Then build the private target, which downloads the pinned cloudflared binary
# and checks its checksum. The private container is started only without a
# tunnel token, on a network that cannot reach Cloudflare. The job does not
# download EIA or PJM data, score the holdout, push an image, or read a secret.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-image:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out pull request files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the portable image
        run: docker build --pull --target portable -t infralens-api:ci .

      - name: Exercise the image
        run: python3 deploy/ci_portable_image.py

      - name: Build the private image
        run: docker build --target private -t infralens-api:private .

      - name: Check the private image without a tunnel
        run: python3 deploy/ci_private_image.py

      - name: Remove the runner container
        if: always()
        run: docker rm -f infralens-api-ci || true
