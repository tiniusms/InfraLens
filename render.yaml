# Proposed Render web service. Applying this blueprint creates a service and
# is a manual step. This file does not provision anything by itself.
# autoDeploy is off so a git push does not publish the API.
services:
  - type: web
    name: infralens-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/status
    autoDeploy: false
    envVars:
      - key: INFRALENS_ROOT
        value: /app
      - key: INFRALENS_CORS_ORIGINS
        sync: false
      - key: INFRALENS_ALLOWED_HOSTS
        sync: false
